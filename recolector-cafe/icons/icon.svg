<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A27" />
      <stop offset="50%" stop-color="#1B3B18" />
      <stop offset="100%" stop-color="#0F240E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="beanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D4925" />
      <stop offset="50%" stop-color="#5C2C16" />
      <stop offset="100%" stop-color="#3A170B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fondo redondeado estilo App Icon -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Círculo interior sutil -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <g filter="url(#shadow)">
    <!-- Canasto / Cajuela base -->
    <path d="M120 250 L150 400 Q155 415 170 415 L342 415 Q357 415 362 400 L392 250 Z" 
          fill="#A0522D" stroke="#5C2C16" stroke-width="10" />

    <!-- Textura tejida de la cajuela de recolección -->
    <path d="M135 290 L377 290 M142 330 L370 330 M150 370 L362 370" 
          stroke="#7A3E1D" stroke-width="6" stroke-linecap="round" />
    <path d="M190 260 L210 415 M256 250 L256 415 M322 260 L302 415" 
          stroke="#7A3E1D" stroke-width="6" stroke-linecap="round" opacity="0.6" />

    <!-- Borde superior reforzado de la cajuela (madera) -->
    <rect x="110" y="240" width="292" height="24" rx="8" fill="#5C2C16" stroke="#3A170B" stroke-width="4" />

    <!-- Granos de café maduros en la cajuela -->
    <!-- Grano izquierdo rojo maduro -->
    <ellipse cx="190" cy="225" rx="42" ry="32" transform="rotate(-25 190 225)" fill="#C62828" stroke="#8E0000" stroke-width="5" />
    <path d="M175 205 Q190 225 205 245" fill="none" stroke="#680000" stroke-width="5" stroke-linecap="round" />

    <!-- Grano derecho rojo maduro -->
    <ellipse cx="322" cy="225" rx="42" ry="32" transform="rotate(25 322 225)" fill="#D32F2F" stroke="#9A0007" stroke-width="5" />
    <path d="M337 205 Q322 225 307 245" fill="none" stroke="#680000" stroke-width="5" stroke-linecap="round" />

    <!-- Grano central tostado grande con resplandor -->
    <g transform="translate(0, -10)">
      <ellipse cx="256" cy="185" rx="55" ry="42" fill="url(#beanGrad)" stroke="#271008" stroke-width="6" />
      <!-- Fisura característica del grano de café en 'S' -->
      <path d="M256 148 C240 168 272 202 256 222" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" />
      <path d="M256 148 C240 168 272 202 256 222" fill="none" stroke="#1A0A05" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Hojita de café verde fresco -->
    <path d="M256 125 C230 100 230 70 270 65 C285 95 270 120 256 125 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="4" />
    <path d="M256 125 Q265 95 270 65" fill="none" stroke="#81C784" stroke-width="3" />
  </g>

  <!-- Insignia del símbolo de colón costarricense (₡) -->
  <g transform="translate(370, 370)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="48" fill="url(#goldGrad)" stroke="#B26A00" stroke-width="4" />
    <!-- Símbolo de Colón ₡ -->
    <text x="0" y="18" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="52" fill="#3E2723" text-anchor="middle">₡</text>
  </g>
</svg>
