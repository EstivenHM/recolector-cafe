name: Compilar APK Autonomo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar y empaquetar app
        run: |
          # 1. Crear package.json si no existe
          npm init -y
          
          # 2. Instalar Capacitor localmente
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # 3. Asegurar carpeta www con tus archivos
          mkdir -p www
          if [ -f "index.html" ]; then
            cp -r * www/ 2>/dev/null || true
            rm -rf www/node_modules www/www www/.github 2>/dev/null || true
          fi
          
          # 4. Inicializar y generar proyecto Android nativo
          npx cap init "Recolector de Cafe" "com.recolector.cafe" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: RecolectorCafe-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
